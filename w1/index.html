<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>祿韋慶 | 個人數位名片</title>
    
    <!-- 1. 瀏覽器分頁圖示 (Favicon) -->
    <link rel="icon" href="https://i.postimg.cc/C5ZZVKNx/unnamed-(1).jpg" type="image/jpeg">

    <!-- 2. 社群分享預覽圖 (Open Graph) -->
    <meta property="og:title" content="祿韋慶 | 個人數位名片">
    <meta property="og:description" content="⚙️ 設備維護與自動化探索中，保持熱情、持續優化！">
    <meta property="og:image" content="https://i.postimg.cc/C5ZZVKNx/unnamed-(1).jpg">
    
    <!-- CSS 樣式設定：現代科技暗黑極簡風 (Dark Mode Glassmorphism) -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            background: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.15) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #f8fafc;
        }

        /* 主名片卡片 */
        .card {
            position: relative;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            width: 100%;
            max-width: 340px;
            padding: 40px 28px;
            border-radius: 28px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4),
                        0 0 0 1px rgba(255, 255, 255, 0.05);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5),
                        0 0 25px rgba(56, 189, 248, 0.15);
        }

        /* 圓形大頭貼容器與外框外發光效果 */
        .avatar-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }

        .avatar-wrapper::after {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            border-radius: 50%;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            z-index: 0;
            opacity: 0.8;
        }

        .avatar {
            position: relative;
            z-index: 1;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center 20%;
            border: 3px solid #0f172a;
            display: block;
        }

        /* 姓名 + Facebook 藍勾勾 */
        .name {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 10px;
            letter-spacing: 0.8px;
        }

        .verified-badge {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        /* 個人簡介 */
        .bio {
            font-size: 13.5px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 28px;
            font-weight: 400;
        }

        /* 按鈕組 */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 13px 0;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        /* Instagram 按鈕 (霓虹流光感) */
        .btn-instagram {
            background: linear-gradient(135deg, #e1306c 0%, #fd1d1d 50%, #f56040 100%);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(225, 48, 108, 0.3);
        }

        .btn-instagram:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(225, 48, 108, 0.45);
            filter: brightness(1.08);
        }

        /* Email 按鈕 (深色金屬感) */
        .btn-email {
            background: rgba(255, 255, 255, 0.06);
            color: #f1f5f9;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-email:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
            color: #ffffff;
        }

        /* Icon 樣式 */
        .btn-icon {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- 個人頭像照片 -->
        <div class="avatar-wrapper">
            <img class="avatar" src="https://i.postimg.cc/C5ZZVKNx/unnamed-(1).jpg" alt="祿韋慶的大頭照">
        </div>

        <!-- 姓名與 Facebook 藍勾勾 -->
        <h1 class="name">
            祿韋慶
            <svg class="verified-badge" viewBox="0 0 24 24">
                <path fill="#38bdf8" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
            </svg>
        </h1>
        
        <p class="bio">⚙️ 設備維護與自動化探索中，保持熱情、持續優化！</p>

        <!-- 聯絡按鈕 -->
        <div class="button-group">
            <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" class="btn btn-instagram">
                <svg class="btn-icon" viewBox="0 0 24 24">
                    <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                </svg>
                Instagram
            </a>
            <a href="mailto:your-email@example.com" class="btn btn-email">
                <svg class="btn-icon" viewBox="0 0 24 24">
                    <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                </svg>
                Email 聯絡我
            </a>
        </div>
    </div>

</body>
</html>
