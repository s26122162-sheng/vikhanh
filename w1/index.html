<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>祿韋慶 | 個人數位名片</title>
    
    <!-- 1. 瀏覽器分頁圖示 (Favicon) -->
    <link rel="icon" href="https://i.postimg.cc/C5ZZVKNx/unnamed-(1).jpg" type="image/jpeg">

    <!-- 2. 社群分享預覽圖 (Open Graph) -->
    <meta property="og:title" content="鄧友盛26122162 | 個人數位名片">
    <meta property="og:description" content="⚙️ 設備維護與自動化探索中，保持熱情、持續優化！">
    <meta property="og:image" content="https://i.postimg.cc/C5ZZVKNx/unnamed-(1).jpg">
    
    <!-- CSS 樣式設定 -->
    <style>
        /* 深色高科技霓虹風格 */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: #0b0f19;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(0, 242, 254, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(79, 172, 254, 0.08) 0%, transparent 40%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e2e8f0;
        }

        /* 主名片卡片：玻璃擬態 + 微發光邊框 */
        .card {
            background: rgba(18, 26, 43, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            width: 100%;
            max-width: 340px;
            padding: 40px 28px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid rgba(0, 242, 254, 0.2);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5),
                        0 0 15px rgba(0, 242, 254, 0.1);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        /* 頂部科技裝飾線條 */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #00f2fe, #4facfe);
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 242, 254, 0.5);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6),
                        0 0 25px rgba(0, 242, 254, 0.25);
        }

        /* 外圈發光的頭像 */
        .avatar-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 20px auto;
        }

        .avatar-wrapper::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            z-index: 0;
            opacity: 0.8;
            filter: blur(2px);
        }

        .avatar {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            object-position: center 20%;
            border: 2px solid #0b0f19;
            display: block;
        }

        /* 姓名與藍勾勾 */
        .name {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 21px;
            font-weight: 700;
            color: #ffffff;
            margin: 0 0 10px 0;
            letter-spacing: 0.8px;
        }

        .verified-badge {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            filter: drop-shadow(0 0 4px rgba(24, 119, 242, 0.6));
        }

        /* 個人簡介 */
        .bio {
            font-size: 13.5px;
            color: #94a3b8;
            line-height: 1.6;
            margin: 0 0 28px 0;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* 按鈕組 */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 0;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.5px;
            transition: all 0.25s ease;
            position: relative;
            z-index: 1;
        }

        /* Instagram 按鈕：漸層感 */
        .btn-instagram {
            background: linear-gradient(135deg, #e1306c 0%, #fd1d1d 50%, #f56040 100%);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(225, 48, 108, 0.3);
        }

        .btn-instagram:hover {
            box-shadow: 0 6px 20px rgba(225, 48, 108, 0.5);
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        /* Email 按鈕：青藍賽博光澤 */
        .btn-email {
            background: transparent;
            color: #00f2fe;
            border: 1px solid #00f2fe;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.15);
        }

        .btn-email:hover {
            background: rgba(0, 242, 254, 0.1);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.35);
            transform: translateY(-2px);
            color: #ffffff;
        }
    </style>
</head>
